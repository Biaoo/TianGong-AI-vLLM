name: tiangong-gpustack-ingress
services:
  ingress:
    image: ${GPUSTACK_INGRESS_IMAGE:?Supply verified local nginx image ID}
    container_name: tiangong-gpustack-ingress
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../.secrets/gpustack-ingress/nginx.conf:/etc/nginx/nginx.conf:ro
    command: [nginx, -g, "daemon off;"]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
